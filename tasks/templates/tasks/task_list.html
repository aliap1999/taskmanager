<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست تسک‌ها</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>تسک‌های من</h2>
        <a href="{% url 'task_create' %}" class="btn btn-primary mb-3">تسک جدید</a>
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>عنوان</th>
                    <th>توضیحات</th>
                    <th>وضعیت</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody>
                {% for task in tasks %}
                <tr>
                    <td>{{ task.id }}</td>
                    <td>{{ task.title }}</td>
                    <td>{{ task.description }}</td>
                    <td>{{ task.status }}</td>
                    <td>
                        <a href="{% url 'task_edit' task.id %}" class="btn btn-warning btn-sm">ویرایش</a>
                        <a href="{% url 'task_delete' task.id %}" class="btn btn-danger btn-sm">حذف</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5">هیچ تسکی وجود ندارد.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
